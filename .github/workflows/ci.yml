name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: make test

  integration:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # 27 uses the classic image store, 29 the containerd one.
        dind_image: [docker:27-dind, docker:29-dind]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: make test-integration
        env:
          DIND_IMAGE: ${{ matrix.dind_image }}

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # The latest stable Go: Go 1.23 is end of life and its standard library has
          # known, unfixed vulnerabilities, which would drown out findings in our own code.
          go-version: stable
      # Pinned for reproducibility; Dependabot does not track this line, bump it manually.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...
