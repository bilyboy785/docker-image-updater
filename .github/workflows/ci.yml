name: CI

# Pull requests run the checks once. The Release workflow reuses this file (workflow_call).
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@v5
      - run: mise exec -- go test ./...
        env:
          CGO_ENABLED: "0"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@v5
      # Go version from mise.toml (go.mod range): the binary embeds the standard library, so an
      # end of life Go would report its known vulnerabilities.
      - run: mise exec -- govulncheck ./...

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@v5
      - run: test -z "$(mise exec -- gofmt -l .)"
      - run: mise exec -- go vet ./...
