name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test

  integration:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # 27 uses the classic image store, 29 the containerd one.
        dind_image: [docker:27-dind, docker:29-dind]
    steps:
      - uses: actions/checkout@v4
      - run: make test-integration
        env:
          DIND_IMAGE: ${{ matrix.dind_image }}
