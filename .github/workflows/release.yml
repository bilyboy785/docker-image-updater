name: Release

# Publishing a GitHub release builds and pushes the multi-arch image to GHCR.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        env:
          # Also annotate the multi-arch index: GitHub Packages reads the description from there.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          # Without this the description label would come from the (possibly empty) repository
          # description and override the one set in the Dockerfile.
          labels: |
            org.opencontainers.image.title=docker-image-updater
            org.opencontainers.image.description=Automatically updates running Docker containers when a newer image is available, with health-gated rollback, Telegram notifications and a status dashboard
          annotations: |
            org.opencontainers.image.title=docker-image-updater
            org.opencontainers.image.description=Automatically updates running Docker containers when a newer image is available, with health-gated rollback, Telegram notifications and a status dashboard
          # `latest`, `major` and `major.minor` only for stable releases: never for a release marked
          # as a pre-release on GitHub, nor for a tag with a suffix (-rc.1, -beta, ...).
          # The exact version tag is always published.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !github.event.release.prerelease && !contains(github.event.release.tag_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !github.event.release.prerelease && !contains(github.event.release.tag_name, '-') }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease && !contains(github.event.release.tag_name, '-') }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.event.release.tag_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.5
      # Sign the image digest (every tag resolves to it), keylessly via GitHub OIDC.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      # Fail the release if the signature does not verify with the expected identity.
      - name: Verify the signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          repo_re="${GITHUB_REPOSITORY,,}"
          repo_re="${repo_re//./\\.}"
          cosign verify \
            --certificate-identity-regexp "^https://github\.com/${repo_re}/\.github/workflows/release\.yml@refs/tags/.*$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}"
